name: Python syntax

on:
  push:
  pull_request:

jobs:
  compile-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Streamlit entrypoint
        run: python -m py_compile app.py
      - name: Reject unresolved merge markers and obsolete UI fragment
        run: |
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' app.py
          ! grep -nF '(&gt; 10 %) et le P/E' app.py
          ! grep -nF '<div class="analysis-grid">' app.py
          ! grep -nF 'TENDANCE HAUSSIÈRE' app.py
          test "$(grep -c 'Plan de Trading Suggéré' app.py)" -eq 1
          test "$(grep -c 'Risque / récompense' app.py)" -eq 1
